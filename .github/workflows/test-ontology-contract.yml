name: Test ZHI ontology semantic contract

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/ontology-semantic-validation.ts"
      - "supabase/functions/_shared/ontology-semantic-validation.test.ts"
      - "schemas/zhi-ontology-draft-v1.schema.json"
      - ".github/workflows/test-ontology-contract.yml"
  push:
    branches:
      - "feat/ontology-dictionary-studio"
    paths:
      - "supabase/functions/_shared/ontology-semantic-validation.ts"
      - "supabase/functions/_shared/ontology-semantic-validation.test.ts"
      - "schemas/zhi-ontology-draft-v1.schema.json"
      - ".github/workflows/test-ontology-contract.yml"

permissions:
  contents: read

jobs:
  semantic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format check
        run: deno fmt --check supabase/functions/_shared/ontology-semantic-validation.ts supabase/functions/_shared/ontology-semantic-validation.test.ts
      - name: Type check
        run: deno check supabase/functions/_shared/ontology-semantic-validation.ts supabase/functions/_shared/ontology-semantic-validation.test.ts
      - name: Run semantic contract tests
        run: deno test supabase/functions/_shared/ontology-semantic-validation.test.ts
