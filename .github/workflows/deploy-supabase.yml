name: Deploy ZEE Edge Function to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/zhi-agnes-chat/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jozrslgdjreepxplicen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ZEE AI function
        run: supabase functions deploy zhi-agnes-chat --project-ref "$PROJECT_REF"
