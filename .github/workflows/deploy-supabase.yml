name: Deploy ZEE Edge Functions to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/zhi-agnes-chat/**"
      - "supabase/functions/zhi-ontology-validate/**"
      - "supabase/functions/_shared/ontology-*.ts"
      - "schemas/zhi-ontology-draft-v1.schema.json"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xeykndpirxfuozeunkku
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase project access
        run: supabase projects list

      - name: Diagnose Edge Functions management API
        continue-on-error: true
        run: supabase functions list --project-ref "$PROJECT_REF" --debug

      - name: Deploy ZEE AI chat function
        run: supabase functions deploy zhi-agnes-chat --project-ref "$PROJECT_REF" --debug

      - name: Deploy ZHI ontology validation function
        run: supabase functions deploy zhi-ontology-validate --project-ref "$PROJECT_REF" --debug
