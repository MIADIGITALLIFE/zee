name: SIP Static Smoke Tests

on:
  pull_request:
    paths:
      - "sip-engine/**"
      - "tests/sip-smoke-test.mjs"
      - ".github/workflows/sip-smoke-test.yml"
  push:
    branches: [main]
    paths:
      - "sip-engine/**"
      - "tests/sip-smoke-test.mjs"
      - ".github/workflows/sip-smoke-test.yml"

permissions:
  contents: read

jobs:
  sip-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax and static requirements
        run: node tests/sip-smoke-test.mjs
