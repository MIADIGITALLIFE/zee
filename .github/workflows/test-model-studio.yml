name: Test ZEE model studio interactions

on:
  pull_request:
    paths:
      - "model.html"
      - "tests/model-studio.spec.cjs"
      - "schemas/**"
      - "docs/**"
      - ".github/workflows/test-model-studio.yml"
  push:
    branches:
      - "feat/ontology-dictionary-studio"
    paths:
      - "model.html"
      - "tests/model-studio.spec.cjs"
      - "schemas/**"
      - "docs/**"
      - ".github/workflows/test-model-studio.yml"

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Playwright
        run: npm install --no-save @playwright/test ajv ajv-formats
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser interaction tests
        run: npx playwright test tests/model-studio.spec.cjs --reporter=line
