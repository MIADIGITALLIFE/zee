name: CMM Edge Function Validation

on:
  pull_request:
    paths:
      - "supabase/functions/cognitive-memory-manager/**"
      - "supabase/functions/cognitive-evidence-validator/**"
      - ".github/workflows/cmm-validation.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/cognitive-memory-manager/**"
      - "supabase/functions/cognitive-evidence-validator/**"
      - ".github/workflows/cmm-validation.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check consolidation API
        run: deno check supabase/functions/cognitive-memory-manager/index.ts
