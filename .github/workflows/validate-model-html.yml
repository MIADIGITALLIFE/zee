name: Validate ZEE model studio

on:
  pull_request:
    paths:
      - "model.html"
      - "schemas/**"
      - "scripts/validate_model_html.py"
      - ".github/workflows/validate-model-html.yml"
  push:
    branches:
      - "feat/ontology-dictionary-studio"
    paths:
      - "model.html"
      - "schemas/**"
      - "scripts/validate_model_html.py"
      - ".github/workflows/validate-model-html.yml"

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate HTML and embedded JavaScript
        run: python scripts/validate_model_html.py
