name: Deploy CMM to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/cognitive-memory-manager/**"
      - "supabase/functions/cognitive-evidence-validator/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-cmm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-cmm:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: xeykndpirxfuozeunkku
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_DB_PASSWORD"
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link target Supabase project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --yes

      - name: Deploy Cognitive Memory Manager
        run: supabase functions deploy cognitive-memory-manager --project-ref "$PROJECT_REF"

      - name: Deploy Cognitive Evidence Validator
        run: supabase functions deploy cognitive-evidence-validator --project-ref "$PROJECT_REF"

      - name: Verify deployed functions
        run: supabase functions list --project-ref "$PROJECT_REF"
